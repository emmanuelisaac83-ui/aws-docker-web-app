<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Web Application on AWS</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px;
      margin: 80px auto; padding: 24px; line-height: 1.6; }
    h1 { color: #1769aa; }
    .status { padding: 12px; background: #e8f5e9; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Hello from Docker!</h1>
  <p>This web application is running inside a Docker container on AWS EC2.</p>
  <p class="status">Application status: Running</p>
  <p>Containerization makes application packaging and deployment more consistent.</p>
</body>
</html>

services:
  web:
    build: .
    container_name: docker-web
    ports:
      - "80:80"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: docker-mysql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
